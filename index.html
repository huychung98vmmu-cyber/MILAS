<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MILAS - Hệ thống Quản lý & Phê duyệt Giáo án Điện tử</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g9:#0f3d22;--g8:#14532d;--g7:#166534;--g5:#22a559;--g2:#dcefdc;--g1:#eef7ee;--bg:#f0f6f0;--card:#fff;--tx:#1b2a1f;--mu:#5d6f62;--bd:#d3e3d3;--gold:#c9a227;--red:#b91c1c;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a12;--card:#16261b;--tx:#e6f0e8;--mu:#9bb0a0;--bd:#2a4030;--g1:#1b2e21;--g2:#244630;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(120% 90% at 50% 0,#1c7a3f,#0f4a27 55%,#0a3319);position:relative;overflow:hidden}
.flag{position:absolute;top:0;width:min(24vw,300px);aspect-ratio:3/2;transform-origin:0 0;animation:wave 3.2s ease-in-out infinite}
.flag.l{left:0}.flag.r{right:0;animation-delay:-1.4s}
@keyframes wave{0%,100%{transform:skewY(-3deg) scaleX(1)}50%{transform:skewY(3deg) scaleX(.96)}}
@media(prefers-reduced-motion:reduce){.flag{animation:none}}
.lcard{position:relative;width:min(440px,100%);background:linear-gradient(160deg,#fff6cf,#fde9a0);border:2px solid #e8c95a;border-radius:28px;padding:28px 28px 22px;text-align:center;box-shadow:0 20px 60px #0007}
.lcard img{width:104px;height:104px;border-radius:50%;border:3px solid var(--gold);margin-top:-70px;background:#fff}
.lcard h1{margin:10px 0 0;font-size:15px;color:var(--g8);font-weight:800;letter-spacing:.2px}
.lcard h2{margin:2px 0 14px;font-size:24px;color:var(--red);font-weight:800}
.lcard input[type=text],.lcard input[type=password]{width:100%;padding:12px 16px;border-radius:30px;border:1.5px solid #d9b95a;background:#fffdf4;margin-bottom:10px;color:#222}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--g1);color:var(--g8);border:1px solid var(--bd)}
.btn:hover{filter:brightness(.96)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--g5);outline-offset:2px}
.btn.p{background:var(--g7);color:#fff;border-color:var(--g7)}.btn.d{background:var(--red);color:#fff;border-color:var(--red)}.btn.s{padding:4px 10px;font-size:12px}
.lcard .btn.p{width:100%;border-radius:30px;padding:12px;font-size:16px;background:linear-gradient(#1f8a45,#136a31)}
.err{color:var(--red);font-weight:600;min-height:20px;font-size:13px}
.lmeta{display:flex;justify-content:space-between;font-size:12px;color:#5a4d1a;margin-top:6px}
.lnote{font-size:11.5px;color:#6b5a1d;margin-top:12px;border-top:1px solid #e6cf7e;padding-top:8px}
/* app */
header.top{background:linear-gradient(135deg,var(--g9),var(--g8));color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand img{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);background:#fff}
.brand b{font-size:19px;display:block;line-height:1.1}.brand small{opacity:.8;font-size:11.5px}
.sb{display:flex;background:#ffffff22;border-radius:30px;padding:2px 4px 2px 12px;align-items:center;min-width:220px}
.sb input{background:none;border:0;color:#fff;flex:1;padding:6px;min-width:0}.sb input::placeholder{color:#fffa}.sb input:focus{outline:none}.sb button{background:none;border:0;cursor:pointer;font-size:15px;color:#fff}
.ic{position:relative;background:#ffffff22;border:0;color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:16px}
.ic i{position:absolute;top:-4px;right:-4px;background:var(--red);font-size:10px;font-style:normal;border-radius:10px;padding:0 5px;min-width:17px}
.av{background:var(--gold);color:#222;font-weight:800}
.umenu{position:absolute;right:20px;top:64px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;z-index:20;min-width:230px;box-shadow:0 10px 30px #0004}
nav{background:var(--g8);display:flex;gap:4px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:thin}
nav button{white-space:nowrap;background:none;border:0;color:#e6f5ea;padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600}
nav button:hover{background:#ffffff18}nav button.on{background:#fff;color:var(--g8)}
main{max-width:1280px;margin:0 auto;padding:20px 16px 40px}
h3.t{margin:0 0 14px;font-size:20px;color:var(--g8)}@media(prefers-color-scheme:dark){h3.t{color:#bfe8c9}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px}
.card h4{margin:0 0 10px;font-size:14px;color:var(--g7)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:2fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.hero{background:linear-gradient(120deg,var(--g2),var(--g1));border-radius:18px;padding:22px;border:1px solid var(--bd)}
.hero h2{margin:2px 0 4px;font-size:24px}.hero p{margin:0 0 12px;color:var(--mu)}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;border-left:5px solid var(--g5)}
.kpi b{font-size:28px;display:block;line-height:1.1}.kpi span{color:var(--mu);font-size:12.5px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--g1);color:var(--g8);text-align:left;padding:9px 10px;white-space:nowrap}@media(prefers-color-scheme:dark){th{color:#bfe8c9}}
td{padding:9px 10px;border-top:1px solid var(--bd);vertical-align:top}
.badge{display:inline-block;color:#fff;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.bar{height:10px;background:var(--g2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g5),var(--g7))}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tb input,.tb select,.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);width:auto;min-width:0}
.f{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:700px){.f{grid-template-columns:1fr}}
.f label{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:12.5px}.f label input,.f label select,.f label textarea{width:100%;font-weight:400}.f .w{grid-column:1/-1}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mu);font-size:12.5px}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
.md{background:var(--card);border-radius:16px;padding:18px;width:min(860px,100%);border:1px solid var(--bd)}
.md h3{margin:0 0 10px;color:var(--g8)}.tl{border-left:3px solid var(--g5);padding-left:12px;margin:0 0 8px}.tl small{color:var(--mu)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px}.kv dt{color:var(--mu)}.kv dd{margin:0}
.sec{background:var(--g1);border-radius:10px;padding:10px;margin:8px 0;white-space:pre-wrap}
.warn{background:#fff4d6;color:#6b4e00;border:1px solid #e8c95a;border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g8);color:#fff;padding:10px 18px;border-radius:30px;z-index:90}
@media print{header.top,nav,.tb,.noprint{display:none!important}body{background:#fff}}
</style></head><body>

function tplView(id){const t=DB.tpls.find(x=>x.id===id);modal(`<h3>${e(t.name)} · v${e(t.ver)}</h3><p>${e(t.subject)} · ${e(t.field)} · cập nhật ${fd(t.upd)} bởi ${e(uname(t.by))}</p><div class="sec">${e(t.content)}</div><div style="text-align:right">${has('gv','qlht')&&t.active?`<button class="btn p" onclick="closeM();useTpl(${t.id})">Dùng mẫu này</button> `:''}<button class="btn" onclick="closeM()">Đóng</button></div>`)}
async function tplToggle(id){const t=DB.tpls.find(x=>x.id===id);if(!await ask((t.active?'Ngừng sử dụng':'Kích hoạt lại')+' mẫu "'+t.name+'"?'))return;t.active=!t.active;log('Đổi trạng thái giáo án mẫu',t.name);save();render()}
function useTpl(id){const t=DB.tpls.find(x=>x.id===id);view='create';S.ed={_new:1,subject:t.subject,content:t.content,title:'',tplName:t.name};go2()}

const FLD=[['title','Tên bài giảng *','input'],['subject','Môn học / chuyên ngành *','input'],['audience','Đối tượng huấn luyện *','input'],['level','Cấp huấn luyện','input'],['time','Thời gian giảng dạy *','date'],['place','Địa điểm giảng dạy *','input'],['purpose','Mục đích, yêu cầu *','area'],['content','Nội dung bài giảng *','area'],['method','Phương pháp giảng dạy','area'],['process','Tiến trình giảng dạy *','area'],['equip','Vật chất, trang thiết bị bảo đảm','area'],['refs','Tài liệu tham khảo','area']];
V.create=()=>{if(S.ed)return form();const L=DB.lessons.filter(l=>l.author==ME.id||has('qlht'));
return`<h3 class="t">Tạo giáo án</h3><div class="card"><div class="tb"><button class="btn p" onclick="S.ed={_new:1};render()">+ Giáo án mới</button><button class="btn" onclick="go('tpl')">Từ giáo án mẫu</button></div>${tbl('cr',['Mã','Tên bài giảng','Ver','Trạng thái','Cập nhật','Thao tác'],L.map(l=>({t:l.code+l.title,c:[e(l.code),e(l.title),l.ver,badge(l.status),fd(l.upd),`<button class="btn s" onclick="openL(${l.id})">Xem</button> `+(l.author==ME.id&&['draft','revise'].includes(l.status)?`<button class="btn s" onclick="S.ed=DB.lessons.find(x=>x.id==${l.id});render()">Sửa</button> `:'')+`<button class="btn s" onclick="copyL(${l.id})">Sao chép</button>`+(l.author==ME.id&&l.status==='approved'&&latest(l)?` <button class="btn s" onclick="newVer(${l.id})">Phiên bản mới</button>`:'')]})))}</div>`};
function form(){const l=S.ed,a=DB.auto[ME.id];const v=l._new&&a&&!l.title&&!l.content?a:l;
return`<h3 class="t">${l.id?'Chỉnh sửa giáo án '+e(l.code):'Giáo án mới'}${l.tplName?' (từ mẫu: '+e(l.tplName)+')':''}</h3><div class="card"><div class="warn" id="as">Tự động lưu mỗi 5 giây trong lúc soạn.</div><div class="f"><label>Mã giáo án<input disabled value="${e(l.code||'Tự động tạo khi lưu')}"></label><label>Người biên soạn<input disabled value="${e(ME.rk+' '+ME.n)}"></label>${FLD.map(([k,lb,t])=>`<label class="${t==='area'?'w':''}">${lb}${t==='area'?`<textarea id="f_${k}" rows="4">${e(v[k]||'')}</textarea>`:`<input id="f_${k}" type="${t==='date'?'date':'text'}" value="${e(v[k]||'')}">`}</label>`).join('')}<label>Cán bộ phụ trách<select id="f_lead">${DB.users.filter(u=>u.roles.includes('pt')).map(u=>`<option value="${u.id}" ${v.lead==u.id?'selected':''}>${e(u.rk+' '+u.n)}</option>`).join('')}</select></label><label>Tệp đính kèm (Word, PDF, ảnh, Excel ≤ 5 MB)<input type="file" id="f_files" multiple onchange="fchk(this)"></label><div class="w" id="fl">${(l.files||[]).map(f=>e(f.n)).join(', ')}</div></div><div style="margin-top:12px"><button class="btn" onclick="saveL(0)">Lưu bản nháp</button> <button class="btn p" onclick="saveL(1)">Kiểm tra &amp; gửi trình duyệt</button> <button class="btn" onclick="S.ed=null;render()">Đóng</button></div></div>`}
const fcur=()=>{const o={};FLD.forEach(([k])=>o[k]=($('#f_'+k)||{}).value||'');o.lead=+($('#f_lead')||{}).value;return o};
function fchk(i){const ok=/\.(docx?|pdf|png|jpe?g|xlsx?)$/i;S.fl=[...i.files].filter(f=>{if(!ok.test(f.name)){toast('Loại tệp không được phép: '+f.name);return 0}if(f.size>5e6){toast('Tệp quá 5 MB: '+f.name);return 0}return 1}).map(f=>({n:f.name,s:f.size}));$('#fl').textContent=S.fl.map(f=>f.n).join(', ')}
setInterval(()=>{if(ME&&view==='create'&&S.ed&&$('#f_title')){DB.auto[ME.id]=fcur();save();const a=$('#as');if(a)a.textContent='Đã tự động lưu lúc '+new Date().toLocaleTimeString('vi-VN')}},5e3);
const nextCode=()=>'GA-2026-'+String(++DB.seq).padStart(3,'0');
function saveL(send){const o=fcur();if(!o.title.trim())return toast('Nhập tên bài giảng');
if(send){const miss=FLD.filter(f=>f[1].includes('*')&&!o[f[0]].trim()).map(f=>f[1].replace(' *',''));if(miss.length)return toast('Thiếu trường bắt buộc: '+miss.join(', '))}
let l=S.ed;if(!l.id){l={id:Date.now(),code:nextCode(),ver:1,year:+(o.time||'2026').slice(0,4)||2026,author:ME.id,unit:ME.un,status:'draft',reviewer:null,approver:null,sig:null,files:[],hist:[{t:now(),u:ME.u,a:'Tạo bản nháp',n:''}]};DB.lessons.push(l)}
Object.assign(l,o,{upd:now()});if(S.fl)l.files=(l.files||[]).concat(S.fl);S.fl=null;delete DB.auto[ME.id];log('Lưu giáo án',l.code);save();
if(send){S.ed=null;openL(l.id,'submit');render()}else{S.ed=null;toast('Đã lưu bản nháp '+l.code);render()}}
function copyL(id){const o=DB.lessons.find(x=>x.id===id);S.ed={_new:1,...o,id:0,code:'',files:[],title:o.title+' (bản sao)'};delete S.ed.id;render()}
async function newVer(id){const o=DB.lessons.find(x=>x.id===id);if(!await ask('Tạo phiên bản mới của '+o.code+'? Phiên bản đã phê duyệt hiện hành vẫn có hiệu lực cho đến khi bản mới được phê duyệt.'))return;
const n={...JSON.parse(JSON.stringify(o)),id:Date.now(),ver:o.ver+1,status:'draft',sig:null,reviewer:null,approver:null,upd:now(),hist:[{t:now(),u:ME.u,a:'Tạo phiên bản v'+(o.ver+1),n:'Từ bản đã phê duyệt v'+o.ver}]};DB.lessons.push(n);log('Tạo phiên bản mới',n.code+' v'+n.ver);save();S.ed=n;render()}
/* ---------- Chi tiết & quy trình ---------- */
async function openL(id,mode){const l=DB.lessons.find(x=>x.id===id);if(!l)return;const own=l.author==ME.id,A=[];
const pts=DB.users.filter(u=>u.roles.includes('pt')&&u.st==='active'),pds=DB.users.filter(u=>u.roles.includes('pd')&&u.st==='active');
const pk=(arr,i)=>`<label style="font-weight:600;font-size:12.5px">${i}<select id="pk" style="width:100%;padding:8px;border-radius:10px">${arr.map(u=>`<option value="${u.id}">${e(u.rk+' '+u.n+' – '+u.ps)}</option>`).join('')}</select></label>`;
let pick='';
if(own&&['draft','revise'].includes(l.status)){pick=pk(pts,'Chọn cán bộ cấp trên kiểm tra');A.push(['submit','Gửi trình duyệt','p'])}
if(has('pt')&&['submitted','checking'].includes(l.status)&&!own){if(l.status==='submitted')A.push(['take','Nhận kiểm tra','']);pick=pk(pds,'Chuyển cấp có thẩm quyền');A.push(['ret','Trả lại chỉnh sửa','d'],['fwd','Chuyển cấp phê duyệt','p'])}
if(has('pd')&&l.status==='toapprove'&&!own)A.push(['ok','Phê duyệt','p'],['no','Từ chối','d']);
if(has('qlht','admin')&&l.status==='approved')A.push(['arc','Chuyển lưu trữ / hết hiệu lực','']);
const cur=l.status==='approved'&&latest(l);let sg='Chưa ký số';
if(l.sig){const ok=l.sig.hash===await sha(vh(l));sg=`<b style="color:${ok?'#15803d':'#b91c1c'}">${ok?'✔ Chữ ký hợp lệ':'✘ Nội dung đã bị thay đổi sau khi ký'}</b> — ${e(uname(l.sig.by))}, ${fd(l.sig.t)}<br><small>Mã băm: ${e(l.sig.hash.slice(0,24))}…</small>`}
const row=(k,v)=>`<dt>${k}</dt><dd>${e(v)}</dd>`;
modal(`<h3>${e(l.code)} · v${l.ver} · ${e(l.title)}</h3><p>${badge(l.status)} ${l.status==='approved'&&!cur?'<span class="badge" style="background:#475569">Đã bị phiên bản mới thay thế – không dùng</span>':cur?'<span class="badge" style="background:#15803d">Được phép sử dụng</span>':'<span class="badge" style="background:#b45309">Chưa được phép sử dụng</span>'}</p>
<dl class="kv">${row('Môn học',l.subject)}${row('Đối tượng',l.audience+' · '+(l.level||''))}${row('Thời gian / địa điểm',l.time+' · '+l.place)}${row('Người biên soạn',uname(l.author)+' ('+l.unit+')')}${row('Người phụ trách',uname(l.lead))}${row('Tệp đính kèm',(l.files||[]).map(f=>f.n).join(', ')||'Không')}<dt>Ký số</dt><dd>${sg}</dd></dl>
${[['Mục đích, yêu cầu','purpose'],['Nội dung bài giảng','content'],['Phương pháp','method'],['Tiến trình','process'],['Bảo đảm','equip'],['Tài liệu tham khảo','refs']].map(([a,k])=>`<b>${a}</b><div class="sec">${e(l[k])}</div>`).join('')}
<b>Lịch sử xử lý</b>${l.hist.slice().reverse().map(h=>`<div class="tl"><b>${e(h.a)}</b> — ${e(h.u)} <small>${fd(h.t)}</small>${h.n?'<br>'+e(h.n):''}</div>`).join('')}
${A.length?`<div class="card" style="margin-top:10px">${pick}<label style="font-weight:600;font-size:12.5px;display:block;margin-top:8px">Ý kiến / nhận xét<textarea id="nt" rows="2" style="width:100%;padding:8px;border-radius:10px"></textarea></label><div style="margin-top:8px">${A.map(a=>`<button class="btn ${a[2]}" onclick="doAct(${l.id},'${a[0]}')">${a[1]}</button>`).join(' ')}</div></div>`:''}
<div style="text-align:right;margin-top:8px">${DB.lessons.some(o=>o.code===l.code&&o.id!==l.id)?`<button class="btn" onclick="cmpV(${l.id})">So sánh phiên bản</button> `:''}<button class="btn" onclick="window.print()">In</button> <button class="btn" onclick="closeM()">Đóng</button></div>`)}
const vh=l=>JSON.stringify([l.code,l.ver,l.title,l.subject,l.audience,l.time,l.place,l.purpose,l.content,l.method,l.process,l.equip,l.refs]);
async function doAct(id,a){const l=DB.lessons.find(x=>x.id===id),nt=($('#nt')||{}).value||'',pk=+(($('#pk')||{}).value||0),T=(st,txt,who,msg)=>{l.status=st;l.upd=now();l.hist.push({t:now(),u:ME.u,a:txt,n:nt});if(who)note(who,msg);log(txt,l.code);save()};
if(['ret','no'].includes(a)&&!nt.trim())return toast('Cần nhập ý kiến xử lý');
if(a==='ok'||a==='fwd'||a==='no'){if(l.author==ME.id)return toast('Không được tự phê duyệt hồ sơ của chính mình')}
if(!await ask('Xác nhận thao tác: '+({submit:'gửi trình duyệt',take:'nhận kiểm tra',ret:'trả lại chỉnh sửa',fwd:'chuyển cấp phê duyệt',ok:'phê duyệt',no:'từ chối',arc:'chuyển lưu trữ'})[a]+' giáo án '+l.code+'?'))return;
if(a==='submit'){l.reviewer=pk;T('submitted','Gửi trình duyệt',pk,`Có giáo án mới cần kiểm tra: ${l.code}.`)}
if(a==='take')T('checking','Nhận kiểm tra');
if(a==='ret')T('revise','Trả lại để chỉnh sửa',l.author,`Giáo án ${l.code} cần chỉnh sửa: ${nt}`);
if(a==='fwd'){l.approver=pk;T('toapprove','Chuyển cấp phê duyệt',pk,`Giáo án ${l.code} chờ phê duyệt.`)}
if(a==='ok'){DB.lessons.filter(o=>o.code===l.code&&o.id!==l.id&&o.status==='approved').forEach(o=>{o.status='archived';o.hist.push({t:now(),u:ME.u,a:'Hết hiệu lực',n:'Thay bằng v'+l.ver})});l.approver=ME.id;T('approved','Phê duyệt',l.author,`Giáo án ${l.code} đã được phê duyệt.`)}
if(a==='no')T('rejected','Từ chối',l.author,`Giáo án ${l.code} bị từ chối: ${nt}`);
if(a==='arc')T('archived','Chuyển lưu trữ');
toast('Đã xử lý: '+l.code);closeM();go(view)}
/* ---------- So sánh phiên bản ---------- */
function cmpV(id,oid){const l=DB.lessons.find(x=>x.id===id),vs=DB.lessons.filter(o=>o.code===l.code).sort((a,b)=>a.ver-b.ver);const o=vs.find(x=>x.id==oid)||vs.filter(x=>x.ver<l.ver).pop()||vs.find(x=>x.id!==l.id);
const F=[['title','Tên bài giảng'],['subject','Môn học'],['audience','Đối tượng'],['time','Thời gian'],['place','Địa điểm'],['purpose','Mục đích, yêu cầu'],['content','Nội dung'],['method','Phương pháp'],['process','Tiến trình'],['equip','Bảo đảm'],['refs','Tài liệu']];const ch=F.filter(([k])=>(o[k]||'')!==(l[k]||''));
modal(`<h3>So sánh phiên bản · ${e(l.code)}</h3><div class="tb"><label>So v${l.ver} với <select onchange="cmpV(${l.id},this.value)">${vs.filter(x=>x.id!==l.id).map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>v${x.ver} – ${ST[x.status][0]}</option>`).join('')}</select></label></div><p>${ch.length?`Có <b>${ch.length}</b> mục thay đổi.`:'Hai phiên bản có nội dung giống nhau.'}</p>${ch.map(([k,n])=>`<b>${n}</b><div class="grid" style="grid-template-columns:1fr 1fr"><div class="sec" style="background:#fde8e8;color:#5a1111"><small>v${o.ver}</small>\n${e(o[k]||'(trống)')}</div><div class="sec" style="background:#dff3e3;color:#0f3d22"><small>v${l.ver}</small>\n${e(l[k]||'(trống)')}</div></div>`).join('')}<div style="text-align:right;margin-top:8px"><button class="btn" onclick="openL(${l.id})">Quay lại</button></div>`)}
/* ---------- Phê duyệt ---------- */
V.approve=()=>{let L=mine();const f=S.ap_s;if(f)L=L.filter(l=>l.status===f);
return`<h3 class="t">Phê duyệt giáo án</h3><div class="card"><div class="warn">Chỉ giáo án ở trạng thái “Đã phê duyệt” và là phiên bản mới nhất mới được phép sử dụng.</div>${tbl('ap',['Mã','Bài giảng','Người soạn','Cấp xử lý','Trạng thái','Cập nhật','Thao tác'],L.map(l=>({t:l.code+l.title+uname(l.author),c:[e(l.code)+' v'+l.ver,e(l.title),e(uname(l.author)),e(l.status==='toapprove'?uname(l.approver):uname(l.reviewer)),badge(l.status)+(SLA(l)?' <span title="Quá hạn">⚠️</span>':''),fd(l.upd),`<button class="btn s p" onclick="openL(${l.id})">Xem / xử lý</button>`]})),sel('ap_s',Object.entries(ST).map(([k,v])=>[k,v[0]]),'Mọi trạng thái'))}</div>`};
/* ---------- Ký số ---------- */
V.sign=()=>{const L=mine().filter(l=>l.status==='approved'||l.sig);
return`<h3 class="t">Ký số</h3><div class="card"><div class="warn">Chữ ký trong bản này được mô phỏng bằng mã băm SHA-256 gắn với đúng phiên bản. Khi triển khai thật cần tích hợp hệ thống ký số (token/CA) được cấp phép; không dùng ảnh chữ ký thay thế.</div>${tbl('sg',['Mã','Bài giảng','Phiên bản','Trạng thái ký','Thao tác'],L.map(l=>({t:l.code+l.title,c:[e(l.code),e(l.title),'v'+l.ver,l.sig?'Đã ký bởi '+e(uname(l.sig.by))+'<br><small>'+fd(l.sig.t)+'</small>':'Chưa ký',(has('pd')&&!l.sig&&l.status==='approved'&&l.author!=ME.id?`<button class="btn s p" onclick="signL(${l.id})">Ký số</button> `:'')+`<button class="btn s" onclick="openL(${l.id})">Kiểm tra chữ ký</button>`]})))}</div>`};
async function signL(id){const l=DB.lessons.find(x=>x.id===id);if(!await ask('Ký số giáo án '+l.code+' v'+l.ver+'?'))return;l.sig={by:ME.id,t:now(),hash:await sha(vh(l))};l.hist.push({t:now(),u:ME.u,a:'Ký số',n:'Mã băm gắn với phiên bản v'+l.ver});log('Ký số',l.code);save();toast('Đã ký số '+l.code);render()}
/* ---------- Kết quả huấn luyện ---------- */
V.results=()=>{const R=DB.reports.filter(r=>!has('gv')||has('pt','qlht','kt','pd')||r.by==ME.id);const can=DB.lessons.filter(l=>l.status==='approved'&&latest(l)&&(l.author==ME.id));
return`<h3 class="t">Kết quả huấn luyện</h3><div class="card">${has('gv')?`<button class="btn p" onclick="repForm()">+ Báo cáo kết quả giảng dạy</button> <small style="color:var(--mu)">(${can.length} giáo án đã phê duyệt có thể báo cáo)</small>`:''}${tbl('rp',['Mã giáo án','Bài giảng','Người thực hiện','Ngày','Quân số TH/KH','Trạng thái','Thao tác'],R.map(r=>({t:r.code+r.title+uname(r.by)+r.time,c:[e(r.code),e(r.title),e(uname(r.by)),e(r.time),r.act+'/'+r.plan,{draft:'Nháp',submitted:'Chờ xác nhận',confirmed:'Đã xác nhận',revise:'Yêu cầu bổ sung'}[r.status],`<button class="btn s" onclick="repView(${r.id})">Xem</button>`+(r.by==ME.id&&['draft','revise'].includes(r.status)?` <button class="btn s" onclick="repForm(${r.id})">Sửa</button>`:'')]})))}</div>`};
function repForm(id){const r=DB.reports.find(x=>x.id===id)||{},can=DB.lessons.filter(l=>l.status==='approved'&&latest(l)&&l.author==ME.id);if(!id&&!can.length)return toast('Chưa có giáo án đã phê duyệt để báo cáo');
const I=(k,lb,t='text',w='')=>`<label class="${w}">${lb}${t==='area'?`<textarea id="r_${k}" rows="3">${e(r[k]||'')}</textarea>`:`<input id="r_${k}" type="${t}" value="${e(r[k]||'')}">`}</label>`;
modal(`<h3>Báo cáo kết quả giảng dạy</h3><div class="f"><label class="w">Giáo án (đã phê duyệt)<select id="r_code" ${id?'disabled':''}>${(id?DB.lessons.filter(l=>l.code===r.code&&latest(l)):can).map(l=>`<option value="${l.code}">${e(l.code+' – '+l.title)}</option>`).join('')}</select></label>${I('time','Thời gian thực hiện','date')}${I('aud','Đối tượng tham gia')}${I('plan','Quân số theo kế hoạch','number')}${I('act','Quân số thực tế','number')}${I('done','Nội dung đã thực hiện','area','w')}${I('result','Kết quả kiểm tra, đánh giá','area','w')}${I('left','Nội dung chưa hoàn thành','area','w')}${I('diff','Khó khăn, tồn tại','area','w')}${I('prop','Đề xuất, kiến nghị','area','w')}</div><div style="margin-top:10px"><button class="btn" onclick="repSave(${id||0},0)">Lưu nháp</button> <button class="btn p" onclick="repSave(${id||0},1)">Gửi báo cáo</button> <button class="btn" onclick="closeM()">Hủy</button></div>`)}
function repSave(id,send){const v=k=>$('#r_'+k).value;let r=DB.reports.find(x=>x.id===id);const code=id?r.code:v('code');if(send&&(!v('time')||!v('done')||!v('result')))return toast('Nhập thời gian, nội dung đã thực hiện và kết quả');
const l=DB.lessons.find(x=>x.code===code&&latest(x));if(!r){r={id:Date.now(),by:ME.id,code,title:l.title};DB.reports.push(r)}
Object.assign(r,{time:v('time'),aud:v('aud'),plan:+v('plan')||0,act:+v('act')||0,done:v('done'),result:v('result'),left:v('left'),diff:v('diff'),prop:v('prop'),status:send?'submitted':'draft',upd:now()});
if(send)DB.users.filter(u=>u.roles.includes('pt')).forEach(u=>note(u.id,`Báo cáo kết quả giảng dạy ${code} chờ xác nhận.`));log(send?'Gửi báo cáo kết quả':'Lưu nháp báo cáo',code);save();closeM();render()}
function repView(id){const r=DB.reports.find(x=>x.id===id);const k=[['Giáo án',r.code+' – '+r.title],['Người thực hiện',uname(r.by)],['Thời gian',r.time],['Đối tượng',r.aud],['Quân số (KH / TT)',r.plan+' / '+r.act],['Đã thực hiện',r.done],['Kết quả',r.result],['Chưa hoàn thành',r.left],['Khó khăn',r.diff],['Đề xuất',r.prop]];
modal(`<h3>Báo cáo ${e(r.code)}</h3><dl class="kv">${k.map(x=>`<dt>${x[0]}</dt><dd>${e(x[1])}</dd>`).join('')}</dl>${has('pt')&&r.status==='submitted'?`<div class="card"><textarea id="nt" rows="2" placeholder="Ý kiến yêu cầu bổ sung (nếu có)" style="width:100%"></textarea><button class="btn p" onclick="repAct(${id},1)">Xác nhận</button> <button class="btn d" onclick="repAct(${id},0)">Yêu cầu bổ sung</button></div>`:''}<button class="btn" onclick="closeM()">Đóng</button>`)}
function repAct(id,ok){const r=DB.reports.find(x=>x.id===id),n=$('#nt').value;if(!ok&&!n.trim())return toast('Nhập nội dung cần bổ sung');r.status=ok?'confirmed':'revise';r.upd=now();note(r.by,ok?`Báo cáo ${r.code} đã được xác nhận.`:`Báo cáo ${r.code} cần bổ sung: ${n}`);log(ok?'Xác nhận báo cáo':'Yêu cầu bổ sung báo cáo',r.code);save();closeM();render()}
/* ---------- Kế hoạch ---------- */
V.plan=()=>{const ed=has('qlht');return`<h3 class="t">Kế hoạch huấn luyện</h3><div class="card">${ed?'<button class="btn p" onclick="planForm()">+ Thêm bài vào kế hoạch</button>':''}${tbl('pl',['Năm','Môn học','Bài giảng','Dự kiến','Người thực hiện','Giáo án','Hoàn thành'],DB.plans.map(p=>{const l=DB.lessons.filter(x=>x.code===p.code).sort((a,b)=>b.ver-a.ver)[0],done=DB.reports.some(r=>r.code===p.code&&r.status==='confirmed');return{t:p.title+p.subject+uname(p.by),c:[p.year,e(p.subject),e(p.title),e(p.date),e(uname(p.by)),l?badge(l.status):'<span class="badge" style="background:#b45309">Chưa soạn</span>',done?'✅ Đã báo cáo':'⏳ Chưa']}}))}</div>`};
function planForm(){modal(`<h3>Thêm bài vào kế hoạch</h3><div class="f"><label>Năm<input id="p1" type="number" value="2026"></label><label>Môn học<input id="p2"></label><label>Bài giảng<input id="p3"></label><label>Thời gian dự kiến<input id="p4" type="date"></label><label>Người thực hiện<select id="p5">${DB.users.filter(u=>u.roles.includes('gv')).map(u=>`<option value="${u.id}">${e(u.n)}</option>`).join('')}</select></label><label>Mã giáo án liên kết<input id="p6" placeholder="GA-2026-…"></label></div><div style="margin-top:10px"><button class="btn p" onclick="planSave()">Lưu</button> <button class="btn" onclick="closeM()">Hủy</button></div>`)}
function planSave(){const v=i=>$('#p'+i).value.trim();if(!v(2)||!v(3))return toast('Nhập môn học và bài giảng');DB.plans.push({id:Date.now(),year:+v(1),subject:v(2),title:v(3),date:v(4),by:+v(5),code:v(6)});log('Thêm kế hoạch',v(3));save();closeM();render()}
/* ---------- Thống kê ---------- */
V.stats=()=>{const L=DB.lessons,rp=DB.reports,c=s=>L.filter(l=>s.includes(l.status)).length,conf=rp.filter(r=>r.status==='confirmed'),pl=DB.plans,done=pl.filter(p=>conf.some(r=>r.code===p.code)).length;
const by=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m)};const bars=(d,mx)=>d.map(([k,v])=>`<div style="margin:6px 0"><small>${e(k)} — <b>${v}</b></small><div class="bar"><i style="width:${v*100/(mx||1)}%"></i></div></div>`).join('')||'<small>Chưa có dữ liệu</small>';
const nb=L.filter(l=>l.status==='approved'&&latest(l)&&!rp.some(r=>r.code===l.code)).length;
const k=[['Tổng số giáo án',L.length],['Đã trình duyệt',L.length-c('draft')],['Đã phê duyệt',c('approved')],['Đang chờ xử lý',c('submitted checking toapprove')],['Cần chỉnh sửa',c('revise')],['Buổi giảng đã thực hiện',conf.length],['Buổi chưa có báo cáo',nb],['Hoàn thành kế hoạch',(pl.length?Math.round(done*100/pl.length):0)+'%']];
return`<h3 class="t">Thống kê và báo cáo</h3><div class="tb noprint"><button class="btn p" onclick="csvBox('thong-ke-giao-an',[['Mã','Bài giảng','Môn học','Giáo viên','Phiên bản','Trạng thái'],...DB.lessons.map(l=>[l.code,l.title,l.subject,uname(l.author),l.ver,ST[l.status][0]])])">Xuất Excel (CSV)</button><button class="btn" onclick="window.print()">In / lưu PDF</button></div><div class="grid g4">${k.map(x=>`<div class="kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><div class="grid g3" style="margin-top:14px"><div class="card"><h4>Theo trạng thái</h4>${bars(by(L,l=>ST[l.status][0]),L.length)}</div><div class="card"><h4>Theo môn học</h4>${bars(by(L,l=>l.subject),L.length)}</div><div class="card"><h4>Theo giáo viên</h4>${bars(by(L,l=>uname(l.author)),L.length)}</div></div><div class="card"><h4>Kết quả theo đơn vị (báo cáo đã xác nhận)</h4>${bars(by(conf,r=>(DB.users.find(u=>u.id==r.by)||{}).un||'—'),conf.length)}</div>`};
/* ---------- Kho lưu trữ ---------- */
V.arch=()=>{let L=DB.lessons.filter(l=>!has('gv')||has('admin','qlht','pt','pd','kt')||l.author==ME.id||l.status==='approved');const q=S.arch_q;
const f=(k,fn)=>{if(S[k])L=L.filter(fn)};f('a_s',l=>l.status===S.a_s);f('a_y',l=>String(l.year)===S.a_y);f('a_m',l=>l.subject===S.a_m);f('a_d',l=>l.time>=S.a_d);
return`<h3 class="t">Kho lưu trữ</h3><div class="card"><div class="warn">Hồ sơ đã phê duyệt không thể xóa vĩnh viễn bằng thao tác thông thường; hủy hoặc đổi trạng thái lưu trữ theo quy định của đơn vị. Kho gồm giáo án mẫu (${DB.tpls.length}), giáo án và các phiên bản (${DB.lessons.length}), báo cáo (${DB.reports.length}), nhật ký (${DB.logs.length}).</div><button class="btn noprint" style="margin-bottom:8px" onclick="csvBox('kho-luu-tru',[['Mã','Bài giảng','Môn','Giáo viên','Đơn vị','Năm','Trạng thái'],...DB.lessons.map(l=>[l.code,l.title,l.subject,uname(l.author),l.unit,l.year,ST[l.status][0]])])">Xuất danh sách (CSV)</button>${tbl('arch',['Mã','Bài giảng','Môn','Giáo viên','Đơn vị','Năm','Thời gian GD','Trạng thái','Xem'],L.map(l=>({t:[l.code,l.title,uname(l.author),l.subject,l.unit,l.year].join(' '),c:[e(l.code)+' v'+l.ver,e(l.title),e(l.subject),e(uname(l.author)),e(l.unit),l.year,e(l.time),badge(l.status),`<button class="btn s" onclick="openL(${l.id})">Mở</button>`]})),sel('a_s',Object.entries(ST).map(([k,v])=>[k,v[0]]),'Trạng thái')+sel('a_y',[2025,2026,2027].map(String),'Năm')+sel('a_m',[...new Set(DB.lessons.map(l=>l.subject))],'Môn học')+'<input type="date" title="Từ ngày giảng" onchange="S.a_d=this.value;render()" value="'+(S.a_d||'')+'">')}</div>`};
/* ---------- Tài khoản ---------- */
V.acc=()=>`<h3 class="t">Quản lý tài khoản</h3><div class="card"><button class="btn p" onclick="accForm()">+ Cấp tài khoản</button>${tbl('ac',['Tài khoản','Họ tên','Cấp bậc / chức vụ','Đơn vị','Vai trò','Trạng thái','Thao tác'],DB.users.map(u=>({t:u.u+u.n,c:[e(u.u),e(u.n),e(u.rk+' · '+u.ps),e(u.un),u.roles.map(r=>ROLES[r]).join(', '),{active:'Đang hoạt động',temp:'Tạm khóa',locked:'Đã khóa'}[u.st],`<button class="btn s" onclick="accSt(${u.id})">${u.st==='active'?'Khóa':'Mở khóa'}</button> <button class="btn s" onclick="accPw(${u.id})">Đặt lại MK</button> <button class="btn s" onclick="accForm(${u.id})">Sửa</button>`]})))}<small style="color:var(--mu)">Mật khẩu được băm SHA-256, không lưu dạng văn bản thuần. Một người có thể có nhiều vai trò; hệ thống chặn tự phê duyệt hồ sơ của chính mình.</small></div>`;
function accForm(id){const u=DB.users.find(x=>x.id===id)||{u:'',n:'',rk:'',ps:'',un:'',roles:['gv']};modal(`<h3>${id?'Sửa':'Cấp'} tài khoản</h3><div class="f"><label>Tên đăng nhập<input id="u1" value="${e(u.u)}" ${id?'disabled':''}></label><label>Họ tên<input id="u2" value="${e(u.n)}"></label><label>Cấp bậc<input id="u3" value="${e(u.rk)}"></label><label>Chức vụ<input id="u4" value="${e(u.ps)}"></label><label>Đơn vị<input id="u5" value="${e(u.un)}"></label><div class="w"><b style="font-size:12.5px">Vai trò</b><br>${Object.entries(ROLES).map(([k,v])=>`<label style="display:inline-flex;flex-direction:row;gap:4px;margin-right:10px"><input type="checkbox" class="ur" value="${k}" ${u.roles.includes(k)?'checked':''} style="width:auto"> ${v}</label>`).join('')}</div></div><p><small>${id?'':'Mật khẩu ban đầu: 123456 (yêu cầu đổi sau khi đăng nhập).'}</small></p><button class="btn p" onclick="accSave(${id||0})">Lưu</button> <button class="btn" onclick="closeM()">Hủy</button>`)}
async function accSave(id){const v=i=>$('#u'+i).value.trim(),roles=[...document.querySelectorAll('.ur:checked')].map(x=>x.value);if(!v(1)||!v(2)||!roles.length)return toast('Nhập tên đăng nhập, họ tên và chọn vai trò');
let u=DB.users.find(x=>x.id===id);if(!u){if(DB.users.some(x=>x.u===v(1)))return toast('Tên đăng nhập đã tồn tại');u={id:Date.now(),u:v(1),st:'active',h:await sha('123456'),ct:now(),fails:0};DB.users.push(u)}Object.assign(u,{n:v(2),rk:v(3),ps:v(4),un:v(5),roles});log(id?'Sửa tài khoản':'Cấp tài khoản',u.u);save();closeM();render()}
async function accSt(id){const u=DB.users.find(x=>x.id===id);if(u.id===ME.id)return toast('Không thể khóa tài khoản đang đăng nhập');if(!await ask((u.st==='active'?'Khóa':'Mở khóa')+' tài khoản '+u.u+'?'))return;u.st=u.st==='active'?'locked':'active';u.fails=0;log('Đổi trạng thái tài khoản',u.u);save();render()}
async function accPw(id){const u=DB.users.find(x=>x.id===id);if(!await ask('Đặt lại mật khẩu của '+u.u+' về 123456?'))return;u.h=await sha('123456');u.fails=0;log('Đặt lại mật khẩu',u.u);save();toast('Đã đặt lại mật khẩu')}
/* ---------- Nhật ký ---------- */
V.logs=()=>`<h3 class="t">Nhật ký hệ thống</h3><div class="card"><div class="warn">Nhật ký chỉ ghi thêm, giao diện không cung cấp chức năng sửa hoặc xóa.</div>${tbl('lg',['Thời gian','Người thực hiện','Hành động','Đối tượng','Kết quả'],DB.logs.map(l=>({t:l.u+l.a+l.o,c:[fd(l.t),e(l.u),e(l.a),e(l.o),e(l.r)]})),has('admin','kt')?`<button class="btn s" onclick="csvBox('nhat-ky',[['Thời gian','Người','Hành động','Đối tượng','Kết quả'],...DB.logs.map(l=>[fd(l.t),l.u,l.a,l.o,l.r])])">Xuất CSV</button>`:'')}</div>`;
/* ---------- Cài đặt ---------- */
V.set=()=>`<h3 class="t">Cài đặt</h3><div class="grid g2"><div class="card"><h4>Đổi mật khẩu</h4><div class="f"><label>Mật khẩu hiện tại<input type="password" id="s1"></label><label>Mật khẩu mới (≥ 6 ký tự)<input type="password" id="s2"></label></div><p><button class="btn p" onclick="chPw()">Đổi mật khẩu</button></p></div>
<div class="card"><h4>Thông tin cá nhân</h4><div class="f"><label>Họ tên<input value="${e(ME.n)}" disabled></label><label>Chức vụ<input value="${e(ME.ps)}" disabled></label></div><small>Liên hệ quản trị viên để cập nhật.</small></div></div>
${has('admin')?`<div class="card"><h4>Cấu hình &amp; sao lưu</h4><div class="f"><label>Tự đăng xuất sau (phút)<input type="number" id="c1" value="${DB.cfg.timeout}"></label><label>Cảnh báo hồ sơ quá hạn sau (giờ)<input type="number" id="c2" value="${DB.cfg.sla}"></label></div><p><button class="btn p" onclick="DB.cfg={timeout:+$('#c1').value||15,sla:+$('#c2').value||48};save();toast('Đã lưu cấu hình')">Lưu cấu hình</button> <button class="btn" onclick="bk()">Sao lưu dữ liệu</button> <button class="btn" onclick="rs()">Phục hồi dữ liệu</button> <button class="btn d" onclick="rst()">Khôi phục dữ liệu mẫu</button></p></div>`:''}`;
async function chPw(){if(await sha($('#s1').value)!==ME.h)return toast('Mật khẩu hiện tại không đúng');const n=$('#s2').value;if(n.length<6)return toast('Mật khẩu mới tối thiểu 6 ký tự');ME.h=await sha(n);log('Đổi mật khẩu',ME.u);save();toast('Đã đổi mật khẩu')}
function bk(){log('Sao lưu','toàn bộ');modal(`<h3>Sao lưu</h3><p>Sao chép nội dung JSON dưới đây và lưu vào nơi an toàn.</p><textarea id="cb" rows="10" style="width:100%" readonly>${e(JSON.stringify(DB))}</textarea><p><button class="btn p" onclick="$('#cb').select();document.execCommand('copy');toast('Đã sao chép')">Sao chép</button> <button class="btn" onclick="closeM()">Đóng</button></p>`)}
function rs(){modal(`<h3>Phục hồi</h3><p>Dán nội dung JSON sao lưu. Dữ liệu hiện tại sẽ bị thay thế.</p><textarea id="rb" rows="10" style="width:100%"></textarea><p><button class="btn d" onclick="rsDo()">Phục hồi</button> <button class="btn" onclick="closeM()">Hủy</button></p>`)}
async function rsDo(){try{const d=JSON.parse($('#rb').value);if(!d.users||!d.lessons)throw 0;if(!await ask('Thay thế toàn bộ dữ liệu hiện tại?'))return;DB=d;ME=DB.users.find(u=>u.u===ME.u)||DB.users[0];log('Phục hồi','toàn bộ');save();closeM();go('set');toast('Đã phục hồi')}catch{toast('Dữ liệu sao lưu không hợp lệ')}}
async function rst(){if(!await ask('Xóa mọi thay đổi và quay về dữ liệu mẫu?'))return;DB=await seed();save();logout()}
boot();
</script></body></html>
